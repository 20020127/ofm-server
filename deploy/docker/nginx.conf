worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format ofm '$remote_addr - [$time_local] "$request" $status '
                   '$body_bytes_sent "$http_referer" rt=$request_time';
    access_log /var/log/nginx/access.log ofm;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;

    # 推理响应可能较大；0 表示不限制
    client_max_body_size 16m;
    # 流式（SSE）必须关闭缓冲，否则 token 不会实时到达客户端
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    server {
        listen       ${OFM_PROXY_PORT};
        listen       [::]:${OFM_PROXY_PORT};
        server_name  _;

        location / {
            # —— 关键：适配上游「仅回环 + 同源」安全模型 ——
            # 1) Host 必须呈现为回环地址：管理端 structuralRejection 要求
            #    Host 是 127.0.0.1/localhost，否则 403 host-not-loopback。
            # 2) Origin/Referer 置空即不透传：管理端只接受 http:// 同源来源，
            #    浏览器经 TLS 访问时会带 https:// Origin，直接透传会被 403 拒绝。
            #    nginx 规则：值为空字符串的 header 不会传给上游。
            #    推理接口（/v1/*）不校验 Origin，只认 Bearer Key，不受影响。
            proxy_pass         http://127.0.0.1:${OFM_PORT};
            proxy_set_header   Host             127.0.0.1:${OFM_PORT};
            proxy_set_header   Origin           "";
            proxy_set_header   Referer          "";
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # SSE 流式转发
            proxy_set_header   Accept            $http_accept;
            chunked_transfer_encoding on;
        }
    }
}
