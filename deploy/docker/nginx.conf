# Our Free Model —— 容器内 nginx 反代配置
# 由 entrypoint.sh 做端口变量替换后加载（生成到 /tmp/nginx.generated.conf）。
#
# 与上一版的关键差异：
#   1) 日志输出到 /dev/stdout 与 /dev/stderr —— 统一进 docker logs，
#      由 compose 的日志轮转（max-size/max-file）接管，容器内不再有「无人轮转的日志文件」；
#   2) /health 探针请求不记 access log —— 30s 一次探针会淹没有效日志；
#   3) 按来源 IP 限流 —— API Key 一旦外泄，限流是最后一道闸；
#   4) 开启 gzip 与管理端安全响应头。
#
# 关于 include /tmp/ofm-proxy-headers.conf：
#   那一份「Host 必须回环名 / Origin-Referer 置空」的共享请求头片段里带 ${OFM_PORT}
#   占位符，必须与主配置一起做变量替换。若直接 include 镜像里那份原始文件，
#   Host 会原样带上字面量 "${OFM_PORT}"，而服务端用 new URL() 解析 Host 拿不到数字端口
#   → 判为 host-not-loopback → 管理页面与 /api/management/* 全部 403。
#   因此入口脚本会把两份配置都生成到 /tmp 后再加载（/tmp 在容器里是可写的 tmpfs）。
#
# 备份提示：本文件在 Debian/Ubuntu 上可直接被 nginx -t 校验。

# 容器内固定 worker 数：worker_processes auto 会读宿主机 CPU 数，
# 在 128 核宿主机上的小容器里会起出几十个 worker（内存浪费）。按容器 CPU 限额调整。
#
# 刻意不写 worker_rlimit_nofile：nginx 只在 master 启动时调用 setrlimit，非 root 进程
# 无法把上限抬到容器的 hard limit 之上 —— 一旦运行时的 hard limit 小于此处配置值，
# nginx 会直接以 "setrlimit(RLIMIT_NOFILE) failed (1: Operation not permitted)" 退出。
# 需要通过 docker-compose 的 ulimits（或 systemd 的 LimitNOFILE）在进程创建时就给足。
worker_processes    2;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── 日志：统一到容器标准流 ──
    log_format ofm '$remote_addr - [$time_local] "$request" $status '
                   '$body_bytes_sent rt=$request_time uct=$upstream_connect_time '
                   'urt=$upstream_response_time';
    # /health 探针降噪：否则每 30s 一条会淹没日志
    map $request_uri $ofm_loggable {
        default   1;
        /health   0;
    }
    access_log /dev/stdout ofm if=$ofm_loggable;

    # ── 基础防护 ──
    server_tokens      off;          # 不回显 nginx 版本
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # 慢速攻击防护：限制客户端读写超时
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          60s;
    reset_timedout_connection on;

    # 请求体上限：渠道备份导入约 8MB；多图对话（base64 内联）可能更大，留到 32m。
    # 这是对外暴露时的 DoS 面之一，按实际用法收紧。
    client_max_body_size 32m;

    # ── 限流：API Key 外泄时的最后一道闸 ──
    # 推理为长请求、流式为长连接，限流按「请求速率」而非连接数，不影响 SSE。
    limit_req_zone  $binary_remote_addr zone=ofm_api:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=ofm_admin:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ofm_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ── 上游（服务本体，仅回环）──
    upstream ofm_backend {
        server 127.0.0.1:${OFM_PORT};
        keepalive 32;                 # 复用连接，降低长连接场景下的握手开销
        keepalive_timeout 60s;
    }

    # ── 压缩：管理页静态资源 ──
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    # nginx 临时目录（非 root 运行 + 只读根文件系统时必需，由 Dockerfile 预建并授权）
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    proxy_temp_path       /var/lib/nginx/tmp/proxy;

    server {
        # 只监听 IPv4：容器默认网络（bridge）没有 IPv6 地址，多写一行
        # `listen [::]:PORT` 会让 nginx 以 "socket() [::]:8080 failed (97: Address family
        # not supported by protocol)" 启动失败。确需 IPv6 时给容器开 --ipv6 再加这一行。
        listen      ${OFM_PROXY_PORT};
        server_name _;

        # 管理端安全响应头（页面已由上游自带 CSP，这里补齐防嗅探/防嵌套）
        add_header X-Content-Type-Options nosniff   always;
        add_header X-Frame-Options        DENY      always;
        add_header Referrer-Policy        no-referrer always;

        # 管理 API 与页面：并发更严（页面加载会并发拉取若干资源，故给足 burst）
        #
        # 这里必须关缓冲 + 放长读超时：管理页面用 EventSource 连
        # /api/management/events 收实时事件（渠道状态、刷新进度）。
        # 开着 proxy_buffering 时 nginx 会把事件攒在缓冲区里不下发，界面看起来「卡住不更新」；
        # 而默认 60s 的 proxy_read_timeout 会把空闲的 SSE 连接周期性掐断。
        location /api/management/ {
            limit_req  zone=ofm_admin burst=20 nodelay;
            limit_conn ofm_conn 32;
            proxy_pass http://ofm_backend;
            include /tmp/ofm-proxy-headers.conf;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 推理接口：/v1/... 及其无前缀别名（上游两套都注册，见 app/src/forward.js）。
        # 用正则一次性覆盖，避免别名落到 location / 里丢掉「关缓冲」这条关键设置 ——
        # 漏掉时流式响应会被 nginx 缓冲成一整块，客户端看不到逐 token 输出。
        location ~ ^/(v1/chat/completions|v1/responses|v1/messages|v1/messages/count_tokens|v1/models|chat/completions|responses|messages|messages/count_tokens|models)$ {
            limit_req  zone=ofm_api burst=40 nodelay;
            limit_conn ofm_conn 64;
            proxy_pass http://ofm_backend;
            include /tmp/ofm-proxy-headers.conf;
            # SSE 流式：必须关闭缓冲并且不设响应超时，否则 token 不会实时到达客户端
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # 管理页面其余资源与 /health。这里保持默认缓冲（静态资源走缓冲更快），
        # 页面上的长连接事件流在上面 /api/management/ 里单独处理。
        location / {
            limit_req  zone=ofm_admin burst=30 nodelay;
            proxy_pass http://ofm_backend;
            include /tmp/ofm-proxy-headers.conf;
        }
    }
}
