# 反代到 OFM 服务时必需的请求头处理（被 nginx.conf 各 location include）
#
# —— 两个关键约束，勿删 ——
# 1) Host 必须是回环名：服务本体的管理端做 structuralRejection 校验，
#    Host 非 127.0.0.1/localhost 时管理页面全部 403 host-not-loopback。
# 2) Origin / Referer 置空（=不透传）：管理端只接受 http:// 同源来源；
#    浏览器经 TLS 访问会带 https:// Origin，直接透传会被拒。
#    nginx 语义：值为空字符串的 header 不会发送给上游，等效「未提供」。
#    推理接口 /v1/* 只认 Bearer Key、不校验 Origin，不受影响。

proxy_http_version 1.1;
proxy_set_header Host              127.0.0.1:${OFM_PORT};
proxy_set_header Origin            "";
proxy_set_header Referer           "";
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection        "";
proxy_socket_keepalive on;
