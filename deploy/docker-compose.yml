services:
  ofm:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: our-free-model-server:latest
    container_name: ofm
    restart: unless-stopped
    environment:
      # 数据目录（卷挂载点）：API Key、账号凭据、EAC 授权、账目统计都在这里
      OFM_HOME: /data
      # 容器内 OFM 服务端口（仅回环）与 nginx 对外端口
      OFM_PORT: "18900"
      OFM_PROXY_PORT: "8080"
      # 需要访问 Google（Gemini 渠道）等站点时，按需配置代理：
      # HTTPS_PROXY: "http://host.docker.internal:7890"
      # NO_PROXY: "127.0.0.1,localhost"
      # 额外启动参数，例如 "--no-refresh" 跳过启动刷新
      OFM_EXTRA_ARGS: ""
    volumes:
      - ofm-data:/data
    ports:
      # 默认只发布到宿主机回环；对外暴露请改 "80:8080" 或 "443:8080"，
      # 并前置你自己的 TLS 反代 / 安全组。
      - "127.0.0.1:8080:8080"
    # 健康检查镜像内置；此处覆盖为更快的间隔
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  ofm-data:
