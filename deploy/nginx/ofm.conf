# Our Free Model 独立服务 —— 宿主机 nginx 反代（HTTP 版）
#
# 适用场景：裸机 / 系统服务方式部署（node 直接跑，systemd 守护），
# nginx 与 OFM 服务在同一台宿主机上。
#
# 两个必须理解的点（对应上游安全模型，详见 docs/ARCHITECTURE.md）：
#   1) OFM 服务只绑定 127.0.0.1:18900（上游硬性约束，无法配置成 0.0.0.0）；
#   2) 管理端要求 Host 为回环名、且只接受 http:// 同源来源。
# 因此反代必须把 Host 改写为回环地址，并剥离 Origin/Referer。
# 推理接口 /v1/* 不校验 Origin/Host，只认 Bearer API Key。
#
# 安装：
#   sudo cp deploy/nginx/ofm.conf /etc/nginx/conf.d/ofm.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream ofm_backend {
    server 127.0.0.1:18900;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name ofm.example.com;   # TODO: 改成你的域名或服务器 IP

    # 客户端请求体上限（渠道备份导入可达 8MB）
    client_max_body_size 16m;

    # 流式（SSE）实时转发
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://ofm_backend;

        # —— 关键header处理，勿删 ——
        # Host 必须是回环名：管理端 structuralRejection 校验 Host，
        # 否则管理页面全部 403 host-not-loopback。
        proxy_set_header Host 127.0.0.1:18900;
        # Origin/Referer 置空 = 不透传给上游：管理端拒绝 https:// 来源
        # （浏览器经 https 访问会带 https://origin）；置空后按「未提供」放行。
        # 注意：值为空字符串时 nginx 不会把该 header 传给上游。
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
