# Our Free Model 独立服务 —— 宿主机 nginx 反代（HTTP 版）
#
# 适用场景：nginx 与 OFM 服务在同一台宿主机上（裸机 / systemd 方式部署）。
#
# ⚠️ 安全前提：本文件只监听 80，不加密任何流量。仅在你满足下面任一条件时使用：
#     a) 前面还有一层 TLS 反代 / CDN / 负载均衡（并把真实客户端 IP 透传过来，见下方 real_ip 段）；
#     b) 只在内网 / VPN / 跳板机之后访问；
#     c) 临时验证部署。
#   公网直连请改用 ofm-tls.conf。
#   注意：无论哪种情况，API Key 都等同于「本机的免密额度」，明文 HTTP 上被抓包就等于被白嫖。
#
# 两个必须理解的点（对应上游安全模型，详见 docs/ARCHITECTURE.md）：
#   1) OFM 服务只绑定 127.0.0.1:18900（上游硬性约束，无法配置成 0.0.0.0）；
#   2) 管理端要求 Host 为回环名、且只接受 http:// 同源来源。
#      因此反代必须把 Host 改写为回环地址，并剥离 Origin/Referer。
#      推理接口 /v1/* 不校验 Origin/Host，只认 Bearer API Key。
#
# 安装：
#   sudo cp deploy/nginx/ofm.conf /etc/nginx/conf.d/ofm.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 本文件刻意保持「单文件自包含」（不 include 公共片段）：运维只需要拷一个文件、改两处
# 占位符。代价是 ofm.conf 与 ofm-tls.conf 有部分重复 —— 改限流或请求头策略时两个都要改。

# ── 限流区 ──
# 必须定义在 http 上下文；conf.d/*.conf 就是被 include 进 http 的，所以写在这里合法。
# 为什么需要：API Key 一旦外泄，限流是最后一道闸；同时它也是抵御「单 IP 打满额度」的手段。
# 速率按「请求数」而非连接数限制 —— 推理是长请求、流式是长连接，
# 按连接数限流会误伤正常的长会话。
limit_req_zone  $binary_remote_addr zone=ofm_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ofm_admin:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ofm_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# /health 探针降噪：监控每 30s 打一次，不映射掉会把有效日志淹掉
map $request_uri $ofm_loggable {
    default   1;
    /health   0;
}

# 日志格式：带上游耗时，排障时能区分「上游慢」和「网络慢」。
# 注意 log_format 只能出现在 http 上下文 —— conf.d/*.conf 正好被 include 进 http，
# 但绝不能写进下面的 server 块里（否则 nginx -t 直接报 "log_format directive is not allowed here"）。
log_format ofm '$remote_addr - [$time_local] "$request" $status '
               '$body_bytes_sent rt=$request_time '
               'urt=$upstream_response_time';

upstream ofm_backend {
    server 127.0.0.1:18900;
    # 连接复用：省掉每次请求的 TCP 握手，长连接场景下差别明显
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

server {
    listen      80;
    # 若宿主机禁用了 IPv6，本行会让 nginx 启动失败（socket() [::]:80 failed 97:
    # Address family not supported by protocol），删掉本行即可。
    listen      [::]:80;
    server_name ofm.example.com;   # TODO: 改成你的域名或服务器 IP

    # 不回显 nginx 版本号
    server_tokens off;

    # ── 访问控制（强烈建议启用）──
    # 这是最有效的一道防线：不暴露公网就不存在被扫、被爆破的问题。
    # 取消下面注释并改成你自己的出口 IP / 内网段；顺序是先 allow 后 deny。
    # allow 203.0.113.10;      # 你的固定出口 IP
    # allow 10.0.0.0/8;        # 内网
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny  all;

    # ── 若前面还有一层反代/CDN，必须还原真实客户端 IP ──
    # 不还原时 $binary_remote_addr 是那层反代的地址 —— 所有访客共用一个限流桶，
    # 一个人跑满就把其他人全部 429。
    # set_real_ip_from  10.0.0.0/8;      # 可信反代的来源网段（务必收紧）
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # 请求体上限：渠道备份导入约 8MB；多图对话（base64 内联）可能更大，留到 32m
    client_max_body_size 32m;

    # 慢速攻击防护
    client_body_timeout   30s;
    client_header_timeout 30s;
    send_timeout          60s;
    reset_timedout_connection on;
    keepalive_timeout     65;
    keepalive_requests    1000;

    # 日志：探针请求不记（access_log 的具体格式见文件顶部 http 上下文的 log_format）
    access_log /var/log/nginx/ofm-access.log ofm if=$ofm_loggable;

    # 管理端安全响应头（页面已由上游自带 CSP，这里补齐防嗅探/防嵌套）
    add_header X-Content-Type-Options nosniff    always;
    add_header X-Frame-Options        DENY       always;
    add_header Referrer-Policy        no-referrer always;

    # 压缩：管理页静态资源
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    # ── 管理 API 与实时事件流 ──
    # 必须关缓冲：管理页面用 EventSource 连 /api/management/events 收实时事件，
    # 开着 proxy_buffering 时事件会被攒在 nginx 缓冲里不下发，界面表现为「不更新」；
    # 默认 60s 的 proxy_read_timeout 还会把空闲的 SSE 连接周期性掐断。
    location /api/management/ {
        limit_req   zone=ofm_admin burst=20 nodelay;
        limit_conn  ofm_conn 32;
        proxy_pass  http://ofm_backend;

        # —— 关键 header 处理，勿删 ——
        # Host 必须是回环名（管理端 structuralRejection 校验 Host，含端口），
        # 否则管理页面与 /api/management/* 全部 403 host-not-loopback。
        proxy_set_header Host 127.0.0.1:18900;
        # Origin/Referer 置空 = 不透传给上游：管理端只接受 http:// 同源来源，
        # 浏览器经 https 访问会带 https:// 的 Origin，透传必被拒。
        # nginx 语义：值为空字符串的 header 不会发给上游，等效「未提供」。
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_http_version  1.1;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── 推理接口：/v1/... 与无前缀别名（上游两套都注册）──
    # 用正则一次覆盖，避免别名落到 location / 而丢掉「关缓冲」——
    # 漏掉时流式响应会被缓冲成一整块，客户端看不到逐 token 输出。
    location ~ ^/(v1/chat/completions|v1/responses|v1/messages|v1/messages/count_tokens|v1/models|chat/completions|responses|messages|messages/count_tokens|models)$ {
        limit_req   zone=ofm_api burst=40 nodelay;
        limit_conn  ofm_conn 64;
        proxy_pass  http://ofm_backend;

        proxy_set_header Host 127.0.0.1:18900;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_http_version  1.1;
        # SSE 流式：关闭缓冲 + 不设响应超时，否则 token 不会实时到达客户端
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }

    # ── 其余路径：管理页面静态资源 + /health ──
    # 这里保持默认缓冲（静态资源走缓冲更快）；页面上的长连接事件流已在上面单独处理。
    location / {
        limit_req   zone=ofm_admin burst=30 nodelay;
        proxy_pass  http://ofm_backend;

        proxy_set_header Host 127.0.0.1:18900;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_http_version 1.1;
    }
}
