# Our Free Model 独立服务 —— 宿主机 nginx 反代（TLS 版）
#
# 在 ofm.conf 的基础上终止 TLS。证书用 certbot 免费签发：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d ofm.example.com
# certbot 会自动把 80 server 块改写为 443 + 重定向，无需手工改本文件。

upstream ofm_backend {
    server 127.0.0.1:18900;
    keepalive 16;
}

# HTTP 仅用于跳转与 certbot 校验
server {
    listen 80;
    listen [::]:80;
    server_name ofm.example.com;   # TODO: 改成你的域名

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ofm.example.com;   # TODO: 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/ofm.example.com/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/ofm.example.com/privkey.pem;     # TODO
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 16m;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 管理页面安全头（上游自身已带 CSP，这里再加一层）
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://ofm_backend;

        # —— 关键header处理，勿删（原理同 ofm.conf）——
        proxy_set_header Host 127.0.0.1:18900;
        proxy_set_header Origin "";
        proxy_set_header Referer "";

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
