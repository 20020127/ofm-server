# Our Free Model 独立服务 —— 宿主机 nginx 反代（TLS 版，公网可用）
#
# 在 ofm.conf 的基础上终止 TLS 并做传输层加固。证书用 certbot 免费签发：
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d ofm.example.com
# certbot 会改写 server_name/证书路径并自动续期；下方两条 ssl_certificate* 用 certbot
# 写入后的值即可（若你没跑 --nginx 模式，就手工填成 /etc/letsencrypt/live/<域名>/ 下的路径）。
#
# ⚠️ 上线前必做：
#   1) 把两处 ofm.example.com 换成你的真实域名；
#   2) 把上游服务的 Host 端口 127.0.0.1:18900 与你实际的 OFM 端口对齐（改端口时三处都要改）；
#   3) 按需启用访问控制段（allow/deny）；
#   4) sudo nginx -t && sudo systemctl reload nginx —— 永远先 -t 再 reload。
#
# 与 ofm.conf 相同的两个约束（不要改）：Host 必须改写为回环名、Origin/Referer 必须置空。
# 原理见 ofm.conf 顶部注释与 docs/ARCHITECTURE.md。

# ── 限流区（http 上下文；conf.d/*.conf 即被 include 进 http）──
limit_req_zone  $binary_remote_addr zone=ofm_api:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=ofm_admin:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ofm_conn:10m;
limit_req_status  429;
limit_conn_status 429;

map $request_uri $ofm_loggable {
    default   1;
    /health   0;
}

# log_format 只能出现在 http 上下文；conf.d/*.conf 正好被 include 进 http。
# 写进 server 块会导致 nginx -t 直接报 "log_format directive is not allowed here"。
log_format ofm '$remote_addr - [$time_local] "$request" $status '
               '$body_bytes_sent rt=$request_time urt=$upstream_response_time';

upstream ofm_backend {
    server 127.0.0.1:18900;
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# ── HTTP：只用于 ACME 校验与跳转，不提供任何业务 ──
server {
    listen      80;
    listen      [::]:80;
    server_name ofm.example.com;

    server_tokens off;

    # certbot 的 webroot 校验路径必须放行，否则续期会失败
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # 301 用 $host 而不是写死域名：多域名/别名访问时不会跳到错误的域名
    location / { return 301 https://$host$request_uri; }
}

server {
    # http2 的写法与 nginx 版本强相关，选错了会直接启动失败：
    #   nginx < 1.25.1（如 Ubuntu 24.04 自带 1.24）：只认 listen ... http2 参数；
    #   nginx ≥ 1.25.1：推荐独立的 http2 on;，旧的 listen ... http2 仍可用但会打弃用告警。
    # 下面用的是兼容面最广的旧写法 —— 新版本只会告警、老版本正常工作。
    # 若你的 nginx ≥ 1.25.1 且想消掉告警，把本行换成 `listen 443 ssl;` 并另起一行 `http2 on;`。
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name ofm.example.com;   # TODO: 改成你的域名

    # ── 证书 ──
    ssl_certificate     /etc/letsencrypt/live/ofm.example.com/fullchain.pem;   # TODO
    ssl_certificate_key /etc/letsencrypt/live/ofm.example.com/privkey.pem;     # TODO

    # ── 传输层加固 ──
    ssl_protocols             TLSv1.2 TLSv1.3;   # 禁掉 TLS1.0/1.1（已不满足合规要求）
    ssl_prefer_server_ciphers off;               # 让客户端挑（移动端有更好的密码套件）
    # 仅 TLS1.2 用到（TLS1.3 的套件由 OpenSSL 固定）。都是 ECDHE + AEAD，前向保密。
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;   # 关掉会话票据：票据密钥泄露可解密历史会话，且与 PFS 目标相悖
    ssl_buffer_size           8k;    # 默认 16k 会额外增加首字节延迟，对 SSE 首包不利

    # OCSP stapling：由服务器代客户端去查吊销状态，省掉客户端一次外网往返
    ssl_stapling              on;
    ssl_stapling_verify       on;
    ssl_trusted_certificate   /etc/letsencrypt/live/ofm.example.com/chain.pem;   # TODO
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout          5s;

    # 不回显 nginx 版本
    server_tokens off;

    # ── 访问控制（按需启用）──
    # allow 203.0.113.10;
    # deny  all;

    # HSTS：首次访问后强制浏览器只用 HTTPS。
    # 先上短周期确认全站无 HTTP 依赖，再逐步加长。
    # includeSubDomains / preload 一旦下发就很难撤销（会被浏览器硬编码），确认所有子域都支持
    # HTTPS 之后再加： "max-age=31536000; includeSubDomains; preload"
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 管理页面安全响应头（上游自身已带 CSP，这里补齐防嗅探/防嵌套）
    add_header X-Content-Type-Options nosniff    always;
    add_header X-Frame-Options        DENY       always;
    add_header Referrer-Policy        no-referrer always;

    client_max_body_size   32m;
    client_body_timeout    30s;
    client_header_timeout  30s;
    send_timeout           60s;
    reset_timedout_connection on;
    keepalive_timeout      65;
    keepalive_requests     1000;

    # 探针请求不记；log_format 定义见文件顶部（http 上下文）
    access_log /var/log/nginx/ofm-access.log ofm if=$ofm_loggable;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml;

    # ── 管理 API 与实时事件流（必须关缓冲，见 ofm.conf 同段注释）──
    location /api/management/ {
        limit_req   zone=ofm_admin burst=20 nodelay;
        limit_conn  ofm_conn 32;
        proxy_pass  http://ofm_backend;

        # —— 关键 header 处理，勿删 ——
        proxy_set_header Host 127.0.0.1:18900;   # 管理端只认回环 Host（含端口）
        proxy_set_header Origin "";              # 置空 = 不透传；严格同源校验见 ARCHITECTURE.md
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 原始 Host 另走 X-Forwarded-Host：管理端靠它 + X-Forwarded-Proto 推导
        # 「用户真正使用的对外地址」，用于「API 接入」页展示与 curl 示例。
        # 上面那行 Host 必须保持回环名，两者互不冲突；少了这行，
        # 页面显示的会是 http://127.0.0.1:18900/v1 这种用户打不开的地址。
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_http_version  1.1;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── 推理接口：/v1/... 与无前缀别名 ──
    location ~ ^/(v1/chat/completions|v1/responses|v1/messages|v1/messages/count_tokens|v1/models|chat/completions|responses|messages|messages/count_tokens|models)$ {
        limit_req   zone=ofm_api burst=40 nodelay;
        limit_conn  ofm_conn 64;
        proxy_pass  http://ofm_backend;

        proxy_set_header Host 127.0.0.1:18900;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_http_version  1.1;
        proxy_buffering     off;
        proxy_cache         off;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        chunked_transfer_encoding on;
    }

    location / {
        limit_req   zone=ofm_admin burst=30 nodelay;
        proxy_pass  http://ofm_backend;

        proxy_set_header Host 127.0.0.1:18900;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_http_version 1.1;
    }
}

# ── 续期后自动重载（certbot 的 deploy hook）──
# certbot 默认会在续期后自行 reload，一般无需手工配置。
# 若你用 --webroot 且 nginx 不在默认路径，可加：
#   /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh:
#     #!/bin/sh
#     nginx -t && systemctl reload nginx
