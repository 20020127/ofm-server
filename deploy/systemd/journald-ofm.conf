# journald 容量上限（安装到 /etc/systemd/journald.conf.d/ofm.conf）
#
# 为什么需要：journald 默认按「磁盘可用空间的 10%」保留日志，且没有时间上限。
# 在一次上游连续失败 + 每 5 分钟探针 + 推理报错的组合下，日志会稳定增长到几十 GB，
# 直到把数据盘写满 —— 这是裸机部署里最常见的「服务被日志拖死」路径。
# （容器部署侧对应的是 compose 的 logging.options.max-size / max-file。）
#
# 生效：systemctl restart systemd-journald
# 查看：journalctl --disk-usage
# 手动回收：journalctl --vacuum-size=500M  （或 --vacuum-time=2weeks）

[Journal]
# 日志目录总量上限（含所有单元，非仅 ofm）
SystemMaxUse=500M
# 至少给文件系统留出 1G 可用空间，避免把盘写满
SystemKeepFree=1G
# 单文件上限
SystemMaxFileSize=50M
# 最长保留两周
MaxRetentionSec=2week

# 速率限制：默认每个服务 30s 内最多 10000 条，超出部分会被丢弃并计数。
# 本服务的日志量（含每 5 分钟的探针）远低于默认值，但如果把探针调成 1 分钟一次、
# 或把日志级别开到 debug，就可能触及上限而丢掉关键错误。
# 出现「服务日志中间莫名断档」时，先看：journalctl -u ofm | tail，再核对本项。
RateLimitIntervalSec=30s
RateLimitBurst=20000
